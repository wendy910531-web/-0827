<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>差一分，人生大不同：平行世界模擬器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 450px; /* 模擬手機直式螢幕 */
      height: 100vh;
      max-height: 800px;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    /* 影片與圖片通用樣式 */
    .media-element {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .active {
      display: block;
    }

    /* 互動 UI 層 */
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
      z-index: 10;
    }

    .ui-title {
      font-size: 1.4rem;
      margin-bottom: 15px;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .button-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .school-btn {
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      border: none;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .school-btn:hover {
      background: #ffffff;
      transform: scale(1.02);
    }

    /* 第一輪失敗紅字警告彈窗 */
    #alert-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #d32f2f;
      color: #fff;
      padding: 20px;
      border-radius: 10px;
      width: 80%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      display: none;
      z-index: 20;
      text-align: center;
    }

    #alert-modal h3 {
      margin-bottom: 10px;
      font-size: 1.5rem;
    }

    /* CTA 宣傳按鈕 */
    .cta-btn {
      background: #ff9800;
      color: #fff;
      border: none;
      padding: 16px 24px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 20px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 影片 1：考完等待放榜 -->
    <video id="video1" class="media-element active" playsinline muted>
      <source src="video1.mp4" type="video/mp4">
    </video>

    <!-- 圖片 1：第一輪成績單 + 志願選擇 UI -->
    <img id="img1" class="media-element" src="img1.jpg" alt="成績單畫面">
    <div id="ui-round1" class="ui-overlay">
      <div class="ui-title">英文：12 級分<br><small style="color: #ff5252;">(請點擊欲選填之夢幻校系)</small></div>
      <div class="button-group">
        <button class="school-btn" onclick="triggerFail()">國立臺灣大學 外文系</button>
        <button class="school-btn" onclick="triggerFail()">國立政治大學 傳播學院</button>
        <button class="school-btn" onclick="triggerFail()">國立清華大學 人文社會系</button>
        <button class="school-btn" onclick="triggerFail()">國立成功大學 外文系</button>
        <button class="school-btn" onclick="triggerFail()">國立臺灣師範大學 英語系</button>
      </div>
    </div>

    <!-- 第一輪失敗彈窗 -->
    <div id="alert-modal">
      <h3>⚠️ 篩選失敗！</h3>
      <p>未達該校系英文門檻 (差 1 級分)</p>
      <p style="font-size: 0.9rem; margin-top: 8px;">連第一階段都無法通過...</p>
    </div>

    <!-- 影片 2：時間倒流重生 -->
    <video id="video2" class="media-element" playsinline muted>
      <source src="video2.mp4" type="video/mp4">
    </video>

    <!-- 影片 3：書店選 235 講義 -->
    <video id="video3" class="media-element" playsinline muted>
      <source src="video3.mp4" type="video/mp4">
    </video>

    <!-- 圖片 2：第二輪逆轉 + 成功結算 UI -->
    <img id="img2" class="media-element" src="img2.jpg" alt="逆轉成功畫面">
    <div id="ui-round2" class="ui-overlay">
      <div class="ui-title" style="color: #4caf50;">【 235 神助攻！補回關鍵 1 級分 】</div>
      <div class="button-group">
        <button class="school-btn" style="border: 2px solid #4caf50;" onclick="triggerSuccess('台大外文')">綠燈解鎖！正取：國立臺灣大學</button>
        <button class="school-btn" style="border: 2px solid #4caf50;" onclick="triggerSuccess('政大傳播')">綠燈解鎖！正取：國立政治大學</button>
        <button class="school-btn" style="border: 2px solid #4caf50;" onclick="triggerSuccess('清大人文')">綠燈解鎖！正取：國立清華大學</button>
      </div>
    </div>

    <!-- 最終結局畫面 -->
    <div id="ui-final" class="ui-overlay">
      <div class="ui-title" style="font-size: 1.8rem; color: #ffd700;">🎉 恭喜錄取！</div>
      <p id="final-desc" style="margin: 15px 0; font-size: 1.1rem;"></p>
      <p style="font-size: 1.2rem; font-weight: bold;">多這一級分，把人生的主導權拿回自己手上！</p>
      <button class="cta-btn" onclick="alert('導流至 235 課程諮詢頁面！')">免費領取：235 補級分祕笈</button>
    </div>
  </div>

  <script>
    // 取得元件
    const v1 = document.getElementById('video1');
    const v2 = document.getElementById('video2');
    const v3 = document.getElementById('video3');
    
    const img1 = document.getElementById('img1');
    const img2 = document.getElementById('img2');

    const uiRound1 = document.getElementById('ui-round1');
    const uiRound2 = document.getElementById('ui-round2');
    const uiFinal = document.getElementById('ui-final');
    const alertModal = document.getElementById('alert-modal');

    // 自動播放第一個影片
    v1.play();

    // 影片 1 播完：進入【圖片 1 + 第一輪選擇 UI】
    v1.onended = function() {
      v1.classList.remove('active');
      img1.classList.add('active');
      uiRound1.style.display = 'flex';
    };

    // 第一輪選擇：不管點哪個按鈕都觸發「失敗警報 ➔ 播放影片 2 (重生)」
    function triggerFail() {
      alertModal.style.display = 'block';
      setTimeout(() => {
        alertModal.style.display = 'none';
        uiRound1.style.display = 'none';
        img1.classList.remove('active');
        
        // 播放影片 2 (重生)
        v2.classList.add('active');
        v2.play();
      }, 1800);
    }

    // 影片 2 (重生) 播完：自動播放影片 3 (書店選 235)
    v2.onended = function() {
      v2.classList.remove('active');
      v3.classList.add('active');
      v3.play();
    };

    // 影片 3 (書店) 播完：進入【圖片 2 + 第二輪選擇 UI】
    v3.onended = function() {
      v3.classList.remove('active');
      img2.classList.add('active');
      uiRound2.style.display = 'flex';
    };

    // 第二輪選擇：選擇成功進入最終結局
    function triggerSuccess(schoolName) {
      uiRound2.style.display = 'none';
      uiFinal.style.display = 'flex';
      document.getElementById('final-desc').innerText = `因為補回了關鍵的 1 級分，你順利闖過篩選，成功考取【${schoolName}】！`;
    }
  </script>

</body>
</html>
