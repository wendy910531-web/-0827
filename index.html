<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>差一分，人生大不同：平行世界模擬器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 800px;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .media-element {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .active {
      display: block;
    }

    /* 點擊解鎖聲音畫面的 Overlay */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      cursor: pointer;
    }

    .start-btn {
      background: #ff9800;
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(255, 152, 0, 0.5);
      animation: pulse 1.5s infinite;
    }

    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding: 20px;
      text-align: center;
      z-index: 10;
    }

    .sms-notification {
      position: absolute;
      top: 22%;
      width: 85%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 14px;
      padding: 12px 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      color: #000;
      text-align: left;
      z-index: 12;
    }

    .sms-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 4px;
    }

    .sms-title {
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 2px;
    }

    .sms-body {
      font-size: 0.85rem;
      color: #222;
      line-height: 1.3;
    }

    .highlight-score {
      color: #d32f2f;
      font-weight: bold;
    }

    .button-group {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 30px;
    }

    .school-btn {
      background: rgba(255, 255, 255, 0.92);
      color: #222;
      border: none;
      padding: 11px 15px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .school-btn:hover {
      background: #ffffff;
      transform: scale(1.02);
    }

    #gate-title-overlay {
      position: absolute;
      top: 9.5%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.3rem;
      font-weight: bold;
      color: #d4af37;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
      letter-spacing: 2px;
      z-index: 11;
      display: none;
      white-space: nowrap;
    }

    #alert-modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #d32f2f;
      color: #fff;
      padding: 20px;
      border-radius: 10px;
      width: 80%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      display: none;
      z-index: 20;
      text-align: center;
    }

    .cta-btn {
      background: #ff9800;
      color: #fff;
      border: none;
      padding: 14px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 15px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <!-- 解鎖音訊覆蓋層 -->
    <div id="start-overlay" onclick="startGame()">
      <button class="start-btn">🔊 點擊開啟體驗（含旁白音效）</button>
    </div>

    <!-- 影片 1（去掉了 muted 屬性，依靠點擊開始解鎖） -->
    <video id="video1" class="media-element active" playsinline>
      <source src="video1.mp4" type="video/mp4">
    </video>

    <!-- 圖片 1：簡訊與 6 個按鈕 -->
    <img id="img1" class="media-element" src="img1.jpg" alt="手機桌面">
    
    <div id="ui-round1" class="ui-overlay">
      <div class="sms-notification">
        <div class="sms-header">
          <span>💬 訊息 ‧ 大考中心</span>
          <span>現在</span>
        </div>
        <div class="sms-title">113學測成績通知</div>
        <div class="sms-body">
          【大考中心】113學測成績：國12、<span class="highlight-score">英8</span>、數A9、社11、自10。應試號碼：10012345。
        </div>
      </div>

      <div class="button-group">
        <p style="font-size: 0.85rem; margin-bottom: 6px; color: #eee; text-shadow: 0 1px 3px #000;">請選擇欲選填之夢幻校系：</p>
        <button class="school-btn" onclick="triggerFail()">國立臺灣大學 外文系</button>
        <button class="school-btn" onclick="triggerFail()">國立政治大學 傳播學院</button>
        <button class="school-btn" onclick="triggerFail()">國立清華大學 人文社會系</button>
        <button class="school-btn" onclick="triggerFail()">國立成功大學 外文系</button>
        <button class="school-btn" onclick="triggerFail()">國立臺灣師範大學 英語系</button>
        <button class="school-btn" onclick="triggerFail()">國立交通大學 外文系</button>
      </div>
    </div>

    <!-- 第一輪失敗彈窗 -->
    <div id="alert-modal">
      <h3>⚠️ 篩選失敗！</h3>
      <p>未達該校系英文門檻 (英文 8 級分，差 1 級分)</p>
      <p style="font-size: 0.85rem; margin-top: 8px;">連第一階段都無法通過...</p>
    </div>

    <!-- 影片 2 -->
    <video id="video2" class="media-element" playsinline>
      <source src="video2.mp4" type="video/mp4">
    </video>

    <!-- 影片 3 -->
    <video id="video3" class="media-element" playsinline>
      <source src="video3.mp4" type="video/mp4">
    </video>

    <!-- 圖片 2 -->
    <img id="img2" class="media-element" src="img2.jpg" alt="校門正取畫面">
    <div id="gate-title-overlay">國立臺灣大學</div>

    <div id="ui-round2" class="ui-overlay" style="justify-content: flex-end;">
      <div style="font-size: 1.1rem; color: #4caf50; font-weight: bold; margin-bottom: 10px; text-shadow: 0 2px 4px #000;">
        【 235 神助攻！補回關鍵 1 級分 】
      </div>
      <div class="button-group">
        <button class="school-btn" style="border: 2px solid #4caf50;" onclick="triggerSuccess('國立臺灣大學')">綠燈解鎖！正取：國立臺灣大學</button>
        <button class="school-btn" style="border: 2px solid #4caf50;" onclick="triggerSuccess('國立政治大學')">綠燈解鎖！正取：國立政治大學</button>
        <button class="school-btn" style="border: 2px solid #4caf50;" onclick="triggerSuccess('國立清華大學')">綠燈解鎖！正取：國立清華大學</button>
        <button class="school-btn" style="border: 2px solid #4caf50;" onclick="triggerSuccess('國立成功大學')">綠燈解鎖！正取：國立成功大學</button>
      </div>
    </div>

    <!-- 最終結局畫面 -->
    <div id="ui-final" class="ui-overlay" style="justify-content: center; background: rgba(0,0,0,0.65);">
      <div style="font-size: 1.8rem; color: #ffd700; font-weight: bold;">🎉 恭喜錄取！</div>
      <p id="final-desc" style="margin: 15px 0; font-size: 1.1rem; line-height: 1.4;"></p>
      <p style="font-size: 1rem; font-weight: bold; color: #fff;">多這一級分，把人生的主導權拿回自己手上！</p>
      <button class="cta-btn" onclick="alert('導流至 235 課程諮詢頁面！')">免費領取：235 補級分祕笈</button>
    </div>
  </div>

  <script>
    const v1 = document.getElementById('video1');
    const v2 = document.getElementById('video2');
    const v3 = document.getElementById('video3');
    
    const img1 = document.getElementById('img1');
    const img2 = document.getElementById('img2');

    const uiRound1 = document.getElementById('ui-round1');
    const uiRound2 = document.getElementById('ui-round2');
    const uiFinal = document.getElementById('ui-final');
    const alertModal = document.getElementById('alert-modal');
    const gateTitleOverlay = document.getElementById('gate-title-overlay');
    const startOverlay = document.getElementById('start-overlay');

    // 玩家點擊「開啟體驗」按鈕後，解鎖音訊並開始播放影片 1
    function startGame() {
      startOverlay.style.display = 'none';
      v1.muted = false; // 取消靜音
      v1.play().catch(error => {
        console.log("Autoplay was prevented:", error);
      });
    }

    // 影片 1 播完：進入【圖片 1 + 簡訊 & 6個志願按鈕】
    v1.onended = function() {
      v1.classList.remove('active');
      img1.classList.add('active');
      uiRound1.style.display = 'flex';
    };

    // 第一輪：點擊任何學校觸發失敗
    function triggerFail() {
      alertModal.style.display = 'block';
      setTimeout(() => {
        alertModal.style.display = 'none';
        uiRound1.style.display = 'none';
        img1.classList.remove('active');
        
        v2.muted = false;
        v2.classList.add('active');
        v2.play();
      }, 1800);
    }

    // 影片 2 (重生) 播完 ➔ 播放影片 3 (書店)
    v2.onended = function() {
      v2.classList.remove('active');
      v3.muted = false;
      v3.classList.add('active');
      v3.play();
    };

    // 影片 3 (書店) 播完 ➔ 進入【圖片 2 (校門) + 第二輪綠燈選擇 UI】
    v3.onended = function() {
      v3.classList.remove('active');
      img2.classList.add('active');
      uiRound2.style.display = 'flex';
    };

    // 第二輪：動態更新大門上的校名，並顯示最終結局
    function triggerSuccess(schoolName) {
      gateTitleOverlay.innerText = schoolName;
      gateTitleOverlay.style.display = 'block';

      uiRound2.style.display = 'none';
      uiFinal.style.display = 'flex';
      document.getElementById('final-desc').innerText = `因為補回了關鍵的 1 級分，你順利通過篩選，成功考取【${schoolName}】！`;
    }
  </script>

</body>
</html>
