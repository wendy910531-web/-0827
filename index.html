<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>差一分，人生大不同：平行世界模擬器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100vh;
      max-height: 800px;
      background-color: #000000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .media-element {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      will-change: opacity;
      transform: translateZ(0);
      transition: opacity 0.15s linear;
      pointer-events: none;
    }

    /* 圖層層級控制 */
    #video1 { z-index: 10; }
    #video2 { z-index: 15; }
    #img2   { z-index: 20; } /* 校門正取圖層 */

    .show {
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    /* 解鎖聲音彈窗 */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      cursor: pointer;
    }

    .start-btn {
      background: #ff9800;
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(255, 152, 0, 0.5);
      animation: pulse 1.5s infinite;
    }

    /* 手機桌面 UI（第一階段專用） */
    #phone-desktop-ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
      z-index: 22;
      pointer-events: none;
    }
